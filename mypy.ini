# Type checking for the application code (tests and scripts are checked by running them).
# Deliberately not `strict`: the goal is that interfaces, Optional handling and return types are honest, without
# annotating every local. Keep `python -m mypy` at zero errors; CI runs it.
[mypy]
files = src, main.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = False
no_implicit_optional = True
