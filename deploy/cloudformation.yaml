AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ai-trading-bot server: one EC2 instance (Ubuntu 22.04 with Docker), a fixed IP, SSH from one address only, and a role
  that can read and write the one broker-login secret. Created by hand in the console (CloudFormation > Create stack >
  Upload a template file); the bots are deployed to it afterwards by deploy/deploy.sh.

Parameters:
  PublicKey:
    Type: String
    Description: The SSH public key (one line, starts with ssh-) that may log in as the ubuntu user.
  SshFrom:
    Type: String
    Description: The only address allowed to SSH in, as a /32 (for example 203.0.113.7/32).
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/32$'
  InstanceType:
    Type: String
    Default: t3.small
    Description: 2 GB of memory is needed for Chromium and the bots together.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

Resources:
  BotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ai-trading-bot - SSH from one address only; the bots only make outbound calls
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshFrom

  BotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: portfolio-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PortfolioAgentSecretOnly
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:*:${AWS::AccountId}:secret:ai-trading-bot/integrated-portfolio-*

  BotProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BotRole]

  BotInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref BotProfile
      SecurityGroupIds: [!GetAtt BotSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2 # the bots run in containers and read the role's credentials through the host
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: false # the databases live on this disk: deleting the stack must not delete them
      Tags:
        - {Key: Name, Value: ai-trading-bot}
        - {Key: Backup, Value: ai-trading-bot}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          mkdir -p /home/ubuntu/.ssh
          echo '${PublicKey}' >> /home/ubuntu/.ssh/authorized_keys
          chown -R ubuntu:ubuntu /home/ubuntu/.ssh
          chmod 700 /home/ubuntu/.ssh
          chmod 600 /home/ubuntu/.ssh/authorized_keys
          apt-get update -y
          apt-get install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
          usermod -aG docker ubuntu

  BotIp:
    Type: AWS::EC2::EIP
    Properties:
      Tags: [{Key: Name, Value: ai-trading-bot}]

  BotIpLink:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt BotIp.AllocationId
      InstanceId: !Ref BotInstance

Outputs:
  PublicIp:
    Description: The fixed address of the server (give this to Claude).
    Value: !Ref BotIp
  InstanceId:
    Value: !Ref BotInstance
